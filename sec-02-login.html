<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 · 登录界面 — VINTAGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(135deg,#070B14 0%,#111B2D 100%);
  min-height:100vh;font-family:'Inter',-apple-system,sans-serif;
  color:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at 50% 40%,rgba(212,175,55,0.04) 0%,transparent 50%);pointer-events:none}

.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:24px;
  padding:14px 32px;background:rgba(7,11,20,0.85);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.06)}
.back{color:rgba(255,255,255,0.5);text-decoration:none;font-size:12px;transition:.2s}
.back:hover{color:#6496E6}
.title{font-family:'Pinyon Script',cursive;font-size:26px;
  background:linear-gradient(135deg,#F3A183,#D4AF37);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;
  text-shadow:0 0 20px rgba(212,175,55,0.1);filter:brightness(1.1)}
.badge{font-size:10px;color:rgba(100,150,230,0.6);border:1px solid rgba(100,150,230,0.2);padding:2px 8px;border-radius:20px}

.login-wrap{width:380px;text-align:center;z-index:1;margin-top:60px}
.brand{font-family:'Pinyon Script',cursive;font-size:48px;
  background:linear-gradient(135deg,#F3A183,#D4AF37);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;margin-bottom:4px;
  text-shadow:0 0 35px rgba(212,175,55,0.18),0 0 70px rgba(212,175,55,0.08);filter:brightness(1.12)}
.subtitle{font-size:11px;font-weight:300;color:rgba(255,255,255,42);
  letter-spacing:5px;text-transform:uppercase;margin-bottom:36px}

.tabs{display:flex;gap:0;margin-bottom:24px;background:rgba(255,255,255,0.03);border-radius:12px;
  padding:3px;border:1px solid rgba(255,255,255,0.06)}
.tab{flex:1;padding:10px;border-radius:10px;font-size:12px;cursor:pointer;transition:all .25s;
  color:rgba(255,255,255,0.4);font-weight:400}
.tab.active{background:rgba(212,175,55,0.1);color:#D4AF37;font-weight:500}

.card{padding:36px 28px;border-radius:20px;
  background:rgba(255,255,255,0.04);backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.08)}

.field{text-align:left;margin-bottom:18px}
.field label{font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:6px;display:block;letter-spacing:.5px}
.input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.9);font-size:13px;
  font-family:'Inter',sans-serif;outline:none;transition:all .25s}
.input:focus{border-color:rgba(212,175,55,0.3);background:rgba(255,255,255,0.05);
  box-shadow:0 0 0 3px rgba(212,175,55,0.06)}
.input::placeholder{color:rgba(255,255,255,0.2)}

.btn{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:4px;text-transform:uppercase;color:#0a0a0a;
  background:linear-gradient(135deg,#F3A183 0%,#D4AF37 100%);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);margin-top:8px;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(212,175,55,0.25)}
.btn:active{transform:scale(0.96)}

.links{display:flex;justify-content:center;gap:16px;margin-top:18px;font-size:11px}
.links a{color:rgba(255,255,255,0.35);text-decoration:none;transition:.2s}
.links a:hover{color:#D4AF37}

.info{margin-top:28px;padding:20px;border-radius:14px;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);
  text-align:left;font-size:10.5px;color:rgba(255,255,255,0.28);line-height:1.9}
.info strong{color:rgba(100,150,230,0.6)}

.nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
.nav a{color:rgba(255,255,255,0.3);text-decoration:none;font-size:12px;margin:0 14px;transition:.2s}
.nav a:hover{color:#D4AF37}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="index.html">← Hub</a>
  <div class="title">Vintage</div>
  <span class="badge">02 · 登录</span>
</div>

<div class="login-wrap">
  <div class="brand">Vintage</div>
  <div class="subtitle">ENTER STARPORT</div>

  <div class="tabs">
    <div class="tab active">邮箱登录</div>
    <div class="tab">手机号登录</div>
  </div>

  <div class="card">
    <div class="field"><label>邮箱地址</label><input class="input" placeholder="your@email.com"></div>
    <div class="field"><label>密码</label><input class="input" type="password" placeholder="••••••••"></div>
    <button class="btn">ENTER STARPORT</button>

    <div class="links">
      <a href="#">忘记密码？</a>
      <span style="color:rgba(255,255,255,0.1)">·</span>
      <a href="#">创建新账号</a>
    </div>
  </div>

  <div class="info">
    <strong>账号隔离：</strong>每位用户拥有独立数据空间，互不干扰。<br>
    <strong>云端同步：</strong>所有数据跨设备实时同步，离线修改联网后自动合并。<br>
    <strong>多人支持：</strong>家庭成员 / 团队成员各自独立账号。
  </div>
</div>

<div class="nav">
  <a href="sec-01-desktop.html">← 桌面端</a>
  <a href="sec-03-mobile.html">手机端 →</a>
  <a href="index.html">Hub</a>
</div>

</body>
</html>
