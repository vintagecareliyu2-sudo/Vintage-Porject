<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<title>Vintage</title>
<!-- 可选：强制指定云端同步地址，例如 <script>window.VINTAGE_SYNC_URL='https://你的域名'</script> -->
<script>window.VINTAGE_SYNC_URL = '';</script>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vintage">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><radialGradient id="p" cx="32%25" cy="28%25" r="75%25"><stop offset="0%25" stop-color="%238FB8FF"/><stop offset="55%25" stop-color="%232E5C9E"/><stop offset="100%25" stop-color="%230D1B33"/></radialGradient></defs><rect width="64" height="64" rx="14" fill="%23070B14"/><circle cx="32" cy="32" r="15" fill="url(%23p)"/><ellipse cx="32" cy="32" rx="26" ry="8" fill="none" stroke="%236E9BE0" stroke-width="1.6" transform="rotate(-18 32 32)" opacity="0.85"/><circle cx="49" cy="17" r="1.4" fill="%23D4AF37"/><circle cx="13" cy="46" r="1" fill="%23ffffff" opacity="0.7"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula n1"></div>
<div class="nebula n2"></div>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-screen">
  <div class="login-card glass">
    <div class="brand-script">Vintage</div>
    <div class="starport">ENTER STARPORT</div>
    <div class="login-tabs">
      <button class="ltab active" data-t="email">EMAIL</button>
      <button class="ltab" data-t="phone">PHONE</button>
    </div>
    <div class="lform">
      <input id="l-id" class="ginput" type="text" placeholder="邮箱地址" autocomplete="username">
      <input id="l-pass" class="ginput" type="password" placeholder="密码" autocomplete="current-password">
      <input id="l-pass2" class="ginput hidden" type="password" placeholder="确认密码">
      <div id="l-msg" class="l-msg"></div>
      <button id="l-go" class="gold-btn press">登 录</button>
      <div class="l-links">
        <span id="l-switch" class="l-link">注册新账号</span>
        <span id="l-reset" class="l-link">重置密码</span>
      </div>
    </div>
    <div class="l-note">账号数据默认在本设备加密存储，账号之间完全隔离。<br>若部署了云端后端：用同一账号登录，手机 / 电脑数据自动云同步。</div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand-script side-brand">Vintage</div>
    <div class="side-sub">TO DO LIST · STARPORT</div>
    <nav id="side-menu"></nav>
    <div id="side-editor" class="side-editor hidden"></div>
    <div class="side-foot">
      <div id="side-user" class="side-user"></div>
      <button id="side-profile" class="mini-btn press">个人中心</button>
    </div>
  </aside>

  <main id="main"></main>

  <nav id="bottom-nav">
    <div class="nav-item press" data-nav="home">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle class="halo" cx="12" cy="12" r="9" fill="none" stroke="#D4AF37" stroke-width=".6" opacity=".25"/><circle class="fl" cx="12" cy="12" r="4"/><circle class="st" cx="12" cy="12" r="7.5" opacity=".45"/></svg></span>
      <span class="nav-lab">HOME</span>
    </div>
    <div class="nav-item press" data-nav="modules">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path class="st comet-p" d="M3 19 Q12 3 21 9"/><circle class="fl" cx="21" cy="9" r="2.2"/><circle class="halo" cx="21" cy="9" r="4.5" fill="none" stroke="#D4AF37" stroke-width=".6" opacity=".3"/></svg></span>
      <span class="nav-lab">ORBIT</span>
    </div>
    <div class="nav-item press" data-nav="pulse">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><circle class="st" cx="12" cy="6.5" r="3.2"/><circle class="st" cx="12" cy="17.5" r="3.2"/><line class="st" x1="12" y1="9.7" x2="12" y2="14.3"/><circle class="halo pulse-r" cx="12" cy="6.5" r="3" fill="none" stroke="#D4AF37" stroke-width=".8"/><circle class="halo pulse-r2" cx="12" cy="17.5" r="3" fill="none" stroke="#D4AF37" stroke-width=".8"/></svg></span>
      <span class="nav-lab">PULSE</span>
    </div>
    <div class="nav-item press" data-nav="profile">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><ellipse class="st" cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-20 12 12)"/><circle class="halo" cx="12" cy="12" r="1.6" fill="#D4AF37"/></svg></span>
      <span class="nav-lab">RING</span>
    </div>
  </nav>
</div>

<!-- 图片放大层 -->
<div id="lightbox" class="hidden"><img id="lightbox-img" alt=""></div>
<!-- Toast -->
<div id="toast"></div>

<script src="js/sync.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script src="js/views.js"></script>
<script src="js/views2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
